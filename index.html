<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR Wedding Ring Box - Hiro Marker</title>

  <!-- A-Frame & AR.js Libraries -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
    }

    #top-panel {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: min(92vw, 520px);
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      text-align: center;
      font-size: 15px;
      line-height: 1.4;
      backdrop-filter: blur(4px);
    }

    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 18px;
      z-index: 20;
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 0 12px;
    }

    button {
      min-width: 140px;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }

    #lid-button { background: #b71c1c; color: #ffffff; }
    #sparkle-button { background: #ffd700; color: #111111; }

    .hint {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      opacity: 0.8;
    }
  </style>

  <script>
    // Component สำหรับอนิเมชันเปิด/ปิดฝากล่อง
    AFRAME.registerComponent('lid-animation', {
      schema: {
        open: { type: 'boolean', default: false }
      },
      init: function () {
        this.currentAngle = 0;
        this.targetAngle = 0;
      },
      update: function () {
        // เมื่อเปิดฝา หมุนหมุนกลับหลัง -110 องศา
        this.targetAngle = this.data.open ? -110 : 0;
      },
      tick: function (_time, deltaMs) {
        if (!deltaMs) return;
        if (Math.abs(this.currentAngle - this.targetAngle) > 0.1) {
          // เลื่อนมุมหมุนแบบนุ่มนวล (Smooth interpolation)
          this.currentAngle += (this.targetAngle - this.currentAngle) * 0.08;
          this.el.setAttribute('rotation', `${this.currentAngle} 0 0`);
        }
      }
    });

    // Component สำหรับอนิเมชันเพชรหมุนและเปล่งประกาย
    AFRAME.registerComponent('diamond-sparkle', {
      schema: {
        active: { type: 'boolean', default: false }
      },
      init: function () {
        this.light = document.querySelector('#sparkle-light');
      },
      tick: function (_time, deltaMs) {
        if (!deltaMs) return;
        // หมุนเพชรเล็กน้อยตลอดเวลา
        this.el.object3D.rotation.y += 0.01;

        if (this.data.active) {
          // เพิ่มเอฟเฟกต์แสงวิบวับ
          const intensity = 1.5 + Math.sin(Date.now() * 0.008) * 0.8;
          if (this.light) {
            this.light.setAttribute('light', 'intensity', intensity);
          }
        } else {
          if (this.light) {
            this.light.setAttribute('light', 'intensity', 0);
          }
        }
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const marker = document.querySelector('#hiro-marker');
      const lidPivot = document.querySelector('#lid-pivot');
      const diamond = document.querySelector('#diamond');
      const topPanel = document.querySelector('#top-panel');
      const lidButton = document.querySelector('#lid-button');
      const sparkleButton = document.querySelector('#sparkle-button');

      let isOpen = false;
      let isSparkling = false;

      marker.addEventListener('markerFound', () => {
        topPanel.innerHTML = 'พบ Hiro Marker แล้ว — กล่องแหวนพร้อมใช้งาน<span class="hint">กดปุ่มด้านล่างเพื่อเปิดฝากล่องหรือเปิดประกายเพชร</span>';
      });

      marker.addEventListener('markerLost', () => {
        topPanel.innerHTML = 'เล็งกล้องไปที่ Hiro Marker<span class="hint">ส่องให้เห็นกล่องสีดำรอบ Marker สว่างชัดเจน</span>';
      });

      lidButton.addEventListener('click', () => {
        isOpen = !isOpen;
        lidPivot.setAttribute('lid-animation', 'open', isOpen);
        lidButton.textContent = isOpen ? 'ปิดฝากล่อง' : 'เปิดฝากล่อง';
      });

      sparkleButton.addEventListener('click', () => {
        isSparkling = !isSparkling;
        diamond.setAttribute('diamond-sparkle', 'active', isSparkling);
        sparkleButton.textContent = isSparkling ? 'ปิดประกายเพชร' : 'ประกายเพชร';
      });
    });
  </script>
</head>

<body>
  <div id="top-panel">
    เล็งกล้องไปที่ Hiro Marker
    <span class="hint">อนุญาตให้ใช้งานกล้องถ่ายรูปในเบราว์เซอร์</span>
  </div>

  <div id="controls">
    <button id="lid-button" type="button">เปิดฝากล่อง</button>
    <button id="sparkle-button" type="button">ประกายเพชร</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; colorManagement: true"
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false"
  >
    <a-marker
      id="hiro-marker"
      preset="hiro"
      emitevents="true"
      smooth="true"
      smooth-count="8"
      smooth-tolerance="0.01"
      smooth-threshold="3"
    >
      <!-- แสงไฟในฉาก -->
      <a-entity light="type: ambient; color: #ffffff; intensity: 0.9"></a-entity>
      <a-entity light="type: directional; color: #ffffff; intensity: 1.2" position="1 4 2"></a-entity>
      <a-entity id="sparkle-light" light="type: point; color: #e0f7fa; intensity: 0; distance: 2" position="0 0.6 0"></a-entity>

      <!-- กลุ่มกล่องแหวนทั้งหมด -->
      <a-entity position="0 0 0" scale="1.5 1.5 1.5">

        <!-- 1. ตัวกล่องล่าง (สีแดงทรงสี่เหลี่ยม) -->
        <a-box
          position="0 0.15 0"
          width="0.5"
          height="0.3"
          depth="0.5"
          color="#8b0000"
          roughness="0.3"
          metalness="0.1"
        ></a-box>

        <!-- ขอบสีทองของตัวกล่องล่าง -->
        <a-box position="0 0.3 0" width="0.51" height="0.01" depth="0.51" color="#d4af37" metalness="0.8" roughness="0.2"></a-box>

        <!-- 2. ฟูกด้านในสีขาว (Inner Cushion) -->
        <a-box
          position="0 0.22 0"
          width="0.44"
          height="0.15"
          depth="0.44"
          color="#f8f9fa"
          roughness="0.9"
        ></a-box>
        <!-- รอยผ่าฟูกแหวน -->
        <a-box position="0 0.295 0" width="0.22" height="0.005" depth="0.04" color="#d1d5db"></a-box>

        <!-- 3. แหวนทอง + เพชร (Gold Ring + Diamond) -->
        <a-entity position="0 0.32 0" rotation="0 45 0">
          <!-- ตัววงแหวนทอง (Gold Band) -->
          <a-torus
            radius="0.065"
            radius-tubular="0.012"
            segments-tubular="32"
            segments-radial="16"
            rotation="90 0 0"
            color="#ffd700"
            metalness="0.9"
            roughness="0.15"
          ></a-torus>

          <!-- ฐานชูเพชร (Prongs) -->
          <a-cone
            position="0 0.065 0"
            radius-bottom="0.01"
            radius-top="0.025"
            height="0.025"
            color="#e5e7eb"
            metalness="0.9"
            roughness="0.1"
          ></a-cone>

          <!-- หัวเพชร (Diamond Geometry) -->
          <a-entity id="diamond" position="0 0.09 0" diamond-sparkle="active: false">
            <!-- ส่วนบนของเพชร -->
            <a-cone
              position="0 0.012 0"
              radius-bottom="0.032"
              radius-top="0.018"
              height="0.02"
              segments-radial="8"
              color="#ffffff"
              material="opacity: 0.9; transparent: true; roughness: 0; metalness: 0.1; emissive: #ffffff; emissiveIntensity: 0.2"
            ></a-cone>
            <!-- ส่วนล่างของเพชร (ก้นแหลม) -->
            <a-cone
              position="0 -0.01 0"
              rotation="180 0 0"
              radius-bottom="0.032"
              radius-top="0"
              height="0.025"
              segments-radial="8"
              color="#ffffff"
              material="opacity: 0.9; transparent: true; roughness: 0; metalness: 0.1; emissive: #ffffff; emissiveIntensity: 0.2"
            ></a-cone>
          </a-entity>
        </a-entity>

        <!-- 4. ฝากล่องพร้อมจุดหมุน (Pivot Lid) -->
        <a-entity id="lid-pivot" position="0 0.3 -0.25" lid-animation="open: false">
          <!-- ตัวฝากล่องสีแดง -->
          <a-box
            position="0 0.15 0.25"
            width="0.51"
            height="0.3"
            depth="0.51"
            color="#8b0000"
            roughness="0.3"
            metalness="0.1"
          ></a-box>
          <!-- บุผ้าสีขาวด้านในฝา -->
          <a-box
            position="0 0.002 0.25"
            width="0.48"
            height="0.005"
            depth="0.48"
            color="#f8f9fa"
            roughness="0.8"
          ></a-box>
          <!-- ขอบสีทองฝากล่อง -->
          <a-box position="0 -0.001 0.25" width="0.52" height="0.01" depth="0.52" color="#d4af37" metalness="0.8" roughness="0.2"></a-box>
        </a-entity>

      </a-entity>
    </a-marker>

    <!-- กล้องถ่ายรูป -->
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
